name: Release

# Changesets release flow:
# merging feature PRs with pending changesets keeps a "Version Packages"
# PR up to date; merging THAT PR is the human sign-off that bumps
# versions, changelogs, and (when publishing is enabled) publishes to npm.
#
# Publishing uses npm Trusted Publishing (OIDC) — no npm token is stored
# in this repo. Each package must have a Trusted Publisher configured on
# npmjs.com pointing at this repo + workflow file.
#
# The NPM_PUBLISH_ENABLED repo variable gates the publish command:
# anything other than 'true' keeps this workflow in version-PR-only mode
# (changeset publish never runs, nothing can reach npm). Flip it in
# Settings → Secrets and variables → Actions → Variables once the
# pending package versions are confirmed ready to ship.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version PR / publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never run on forks: they lack permissions and must not attempt releases.
    if: github.repository == 'arinova-ai/arinova-packages'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          set -euo pipefail
          # npm >= 11.5.1 required for OIDC trusted publishing
          npm install -g npm@11 pnpm@10.28.2
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Create Version Packages PR or publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          # Empty publish input = version-PR-only mode; the gate keeps
          # `changeset publish` unreachable until explicitly enabled.
          publish: ${{ vars.NPM_PUBLISH_ENABLED == 'true' && 'pnpm changeset publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
