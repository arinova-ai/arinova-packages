name: Update moderation URL deny baseline

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-moderation-url-deny
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install -g pnpm@10.28.2
          pnpm install --frozen-lockfile
      - run: pnpm --filter @arinova-ai/moderation-baseline update:url-deny
      - run: pnpm --filter @arinova-ai/moderation-baseline test
      - name: Open or refresh the update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/moderation-baseline/dict/url_deny.toml; then
            echo "URL deny baseline is already current"
            exit 0
          fi

          existing_pr="$(gh pr list --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("automation/update-url-deny-"))][0] // {}')"
          pr_number="$(jq -r '.number // empty' <<<"$existing_pr")"
          branch="$(jq -r '.headRefName // empty' <<<"$existing_pr")"
          expected_head=""
          if [[ -n "$branch" ]]; then
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            expected_head="$(git rev-parse "refs/remotes/origin/$branch")"
          else
            branch="automation/update-url-deny-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add packages/moderation-baseline/dict/url_deny.toml
          git commit -m "chore(moderation-baseline): refresh URL deny snapshot"

          if [[ -n "$pr_number" ]]; then
            git push \
              --force-with-lease="refs/heads/$branch:$expected_head" \
              origin "HEAD:refs/heads/$branch"
            echo "Refreshed PR #$pr_number from the latest main"
          else
            git push --set-upstream origin "$branch"
            gh pr create \
              --title "chore(moderation-baseline): refresh URL deny snapshot" \
              --body "Automated bounded refresh of the moderation URL deny baseline. Package tests passed before this PR was opened." \
              --base main \
              --head "$branch"
          fi

          # PRs created with GITHUB_TOKEN may wait for approval before their
          # pull_request run starts. workflow_dispatch is allowed to run
          # immediately and produces the same required CI check on this SHA.
          gh workflow run ci.yml --ref "$branch"
