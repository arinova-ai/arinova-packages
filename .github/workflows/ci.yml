name: CI

on:
  push:
    branches: [main]
  pull_request:
  # GITHUB_TOKEN-created PRs leave pull_request runs awaiting approval.
  # This trusted-base event is restricted again at every job to same-repo
  # github-actions[bot] automation branches. Test jobs stay read-only.
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint, and test all packages
    if: >-
      github.event_name != 'pull_request_target' ||
      (
        github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'automation/')
      )
    # Public repo: always GitHub-hosted runners, never self-hosted
    # (fork PRs would execute arbitrary code on our infrastructure).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install -g pnpm@10.28.2
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Sync the workspace agent-sdk into the hermes sidecar
        # sidecar/node_modules is npm-managed and outside the pnpm workspace,
        # so it does not exist on a fresh checkout and the plugin gate cannot
        # run. The gate verifies the sidecar against the workspace source, so
        # sync the build rather than installing the older published tarball.
        run: packages/hermes-arinova-plugin/scripts/sync-sidecar-sdk.sh

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

  hermes-integration:
    name: Hermes host integration
    if: >-
      github.event_name != 'pull_request_target' ||
      (
        github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'automation/')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Pin the host revision so upstream changes cannot silently change this
      # repository's required CI gate. Update the SHA deliberately after the
      # plugin passes against a newer Hermes revision.
      - name: Check out the pinned Hermes host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: f51aa6a9b5ce514e15f8e337777f522fd5cc6fa2
          path: .ci/hermes-agent
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install -g pnpm@10.28.2
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check -e \
            "git+https://github.com/NousResearch/hermes-agent.git@f51aa6a9b5ce514e15f8e337777f522fd5cc6fa2#egg=hermes-agent"

      - name: Build and sync the workspace SDK
        run: |
          set -euo pipefail
          pnpm -r build
          packages/hermes-arinova-plugin/scripts/sync-sidecar-sdk.sh

      - name: Verify the plugin against Hermes
        run: |
          set -euo pipefail
          python packages/hermes-arinova-plugin/scripts/check_local.py \
            --hermes-root "$GITHUB_WORKSPACE/.ci/hermes-agent" \
            --hermes-python "$(command -v python)"

  required:
    name: CI required gate
    if: >-
      always() &&
      (
        github.event_name != 'pull_request_target' ||
        (
          github.event.pull_request.user.login == 'github-actions[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'automation/')
        )
      )
    needs:
      - check
      - hermes-integration
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job to pass
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          HERMES_RESULT: ${{ needs.hermes-integration.result }}
        run: |
          set -euo pipefail
          if [[ "$CHECK_RESULT" != "success" || "$HERMES_RESULT" != "success" ]]; then
            echo "CI failed: package checks=$CHECK_RESULT, Hermes integration=$HERMES_RESULT" >&2
            exit 1
          fi

  automation-status:
    name: Publish trusted automation PR status
    if: >-
      always() &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'automation/')
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # The workflow definition comes from the protected base branch, and this
    # job never checks out or executes PR-controlled code.
    permissions:
      statuses: write
    steps:
      - name: Publish the aggregate result on the PR head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RESULT: ${{ needs.required.result }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gate_state=failure
          if [[ "$REQUIRED_RESULT" == "success" ]]; then
            gate_state=success
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$gate_state" \
            -f context="CI required gate" \
            -f description="Trusted automation PR CI: $gate_state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "$gate_state" != "success" ]]; then
            exit 1
          fi
