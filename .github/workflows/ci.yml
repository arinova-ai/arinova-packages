name: CI

on:
  push:
    branches: [main]
  pull_request:
  # GITHUB_TOKEN-created PRs leave pull_request runs awaiting approval. Their
  # creator dispatches this trusted-base event, which validates live PR
  # metadata before any head commit is checked out.
  repository_dispatch:
    types: [trusted-automation-pr-ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.client_payload.pull_request_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-automation:
    name: Validate trusted automation PR
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      skip_clean_install_npm_ci: ${{ steps.pr.outputs.skip_clean_install_npm_ci }}
    steps:
      - id: pr
        name: Match the dispatched payload to the live PR
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          PR_NUMBER: ${{ github.event.client_payload.pull_request_number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid automation PR number" >&2
            exit 1
          fi
          if ! [[ "$PAYLOAD_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid automation PR head SHA" >&2
            exit 1
          fi

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          actual_author="$(jq -r .user.login <<<"$pr_json")"
          actual_base_ref="$(jq -r .base.ref <<<"$pr_json")"
          actual_head_ref="$(jq -r .head.ref <<<"$pr_json")"
          actual_head_repo="$(jq -r .head.repo.full_name <<<"$pr_json")"
          actual_head_sha="$(jq -r .head.sha <<<"$pr_json")"
          actual_state="$(jq -r .state <<<"$pr_json")"

          if [[ "$actual_author" != "github-actions[bot]" ||
                "$actual_base_ref" != "$DEFAULT_BRANCH" ||
                "$actual_head_repo" != "$GITHUB_REPOSITORY" ||
                "$actual_head_sha" != "$PAYLOAD_HEAD_SHA" ||
                "$actual_state" != "open" ]]; then
            echo "Repository dispatch does not match a live same-repo automation PR" >&2
            exit 1
          fi
          case "$actual_head_ref" in
            automation/*)
              skip_clean_install_npm_ci=false
              ;;
            changeset-release/*)
              skip_clean_install_npm_ci=true
              ;;
            *)
              echo "Untrusted automation PR branch: $actual_head_ref" >&2
              exit 1
              ;;
          esac
          echo "head_sha=$actual_head_sha" >> "$GITHUB_OUTPUT"
          echo "skip_clean_install_npm_ci=$skip_clean_install_npm_ci" >> "$GITHUB_OUTPUT"

  check:
    name: Build, lint, and test all packages
    needs: validate-automation
    if: >-
      always() &&
      (github.event_name != 'repository_dispatch' || needs.validate-automation.result == 'success')
    # Public repo: always GitHub-hosted runners, never self-hosted
    # (fork PRs would execute arbitrary code on our infrastructure).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && needs.validate-automation.outputs.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install -g pnpm@10.28.2
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Verify generated sources are committed
        run: git diff --exit-code -- packages/arinova-cli/src/generated/theme-bridge.ts

      - name: Sync the workspace agent-sdk into the hermes sidecar
        # sidecar/node_modules is npm-managed and outside the pnpm workspace,
        # so it does not exist on a fresh checkout and the plugin gate cannot
        # run. The gate verifies the sidecar against the workspace source, so
        # sync the build rather than installing the older published tarball.
        run: packages/hermes-arinova-plugin/scripts/sync-sidecar-sdk.sh

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm test

  hermes-integration:
    name: Hermes host integration
    needs: validate-automation
    if: >-
      always() &&
      (github.event_name != 'repository_dispatch' || needs.validate-automation.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && needs.validate-automation.outputs.head_sha || github.sha }}
          persist-credentials: false

      # Pin the host revision so upstream changes cannot silently change this
      # repository's required CI gate. Update the SHA deliberately after the
      # plugin passes against a newer Hermes revision.
      - name: Check out the pinned Hermes host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: f51aa6a9b5ce514e15f8e337777f522fd5cc6fa2
          path: .ci/hermes-agent
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install -g pnpm@10.28.2
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check -e \
            "git+https://github.com/NousResearch/hermes-agent.git@f51aa6a9b5ce514e15f8e337777f522fd5cc6fa2#egg=hermes-agent"

      - name: Build and sync the workspace SDK
        run: |
          set -euo pipefail
          pnpm -r build
          packages/hermes-arinova-plugin/scripts/sync-sidecar-sdk.sh

      - name: Verify the plugin against Hermes
        env:
          SKIP_CLEAN_INSTALL_NPM_CI: ${{ needs.validate-automation.outputs.skip_clean_install_npm_ci }}
        run: |
          set -euo pipefail
          clean_install_args=()
          if [[ "$SKIP_CLEAN_INSTALL_NPM_CI" == "true" ]]; then
            clean_install_args+=(--skip-clean-install-npm-ci)
          fi
          python packages/hermes-arinova-plugin/scripts/check_local.py \
            --hermes-root "$GITHUB_WORKSPACE/.ci/hermes-agent" \
            --hermes-python "$(command -v python)" \
            "${clean_install_args[@]}"

  required:
    name: CI required gate
    if: >-
      always() &&
      (github.event_name != 'repository_dispatch' || needs.validate-automation.result == 'success')
    needs:
      - validate-automation
      - check
      - hermes-integration
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job to pass
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          HERMES_RESULT: ${{ needs.hermes-integration.result }}
        run: |
          set -euo pipefail
          if [[ "$CHECK_RESULT" != "success" || "$HERMES_RESULT" != "success" ]]; then
            echo "CI failed: package checks=$CHECK_RESULT, Hermes integration=$HERMES_RESULT" >&2
            exit 1
          fi

  automation-status:
    name: Publish trusted automation PR status
    if: >-
      always() &&
      github.event_name == 'repository_dispatch' &&
      needs.validate-automation.result == 'success'
    needs:
      - validate-automation
      - required
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # The workflow definition comes from the protected base branch, and this
    # job never checks out or executes PR-controlled code.
    permissions:
      statuses: write
    steps:
      - name: Publish the aggregate result on the PR head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RESULT: ${{ needs.required.result }}
          TARGET_SHA: ${{ needs.validate-automation.outputs.head_sha }}
        run: |
          set -euo pipefail
          gate_state=failure
          if [[ "$REQUIRED_RESULT" == "success" ]]; then
            gate_state=success
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$gate_state" \
            -f context="CI required gate" \
            -f description="Trusted automation PR CI: $gate_state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "$gate_state" != "success" ]]; then
            exit 1
          fi
