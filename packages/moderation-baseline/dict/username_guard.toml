[meta]
list_name      = "username_guard"
version        = "0.1.0-seed"
last_updated   = "2026-07-18"
maintained_by  = "Ripple Company / Iris (seed) → Hank (extend)"
review_cadence = "monthly"

# Username guard list — applies only to `username.input` (one-time
# username setup). Three concerns:
#   1. reserved-handle: platform-role impersonation (admin/support/…)
#   2. brand-impersonation: Arinova brand squatting
#   3. profanity: EN + romanized-zh slurs/vulgarity
#   4. celebrity-impersonation: romanized names for zh_celeb entries
#      that carry no ASCII alias (politicians / religious figures).
#      Alias-bearing zh_celeb entries are covered by the consumer's
#      normalized-alias derivation, NOT duplicated here.
#
# Matching notes: usernames are already format-validated to
# ^[a-z][a-z0-9_]* before this list runs. `pattern` entries use
# (^|[^a-z]) / ([^a-z]|$) as token boundaries — digits and underscores
# both break a token — so `admin_team` and `admin123` match while
# `badminton` does not. Plain `key` entries are substring matches;
# only terms that essentially never occur inside innocent words go in
# as keys.
#
# A trailing ([^a-z]|$) bound also lets a compound handle through
# (`bitchboy`, `systemadmin`), so terms whose only false positives are
# a handful of real words name those words in `except` instead: the
# consumer removes every `except` occurrence from the username before
# matching, so `bitchute` stays free while `bitchboy` is blocked. Keep
# `except` lists short and literal — they are exemptions from a safety
# rule, not a spellcheck dictionary.
#
# `except` is also what promotes a term to a plain `key`: once the
# innocent words are enumerable, substring matching is safe and closes
# the prefix hole a leading (^|[^a-z]) bound leaves open (`xxcunt`).
# Terms whose innocent compounds are open-ended (`system` → systemd,
# ecosystem, …) stay boundary patterns, since no finite `except` list
# would cover them.

# ── reserved-handle ─────────────────────────────────────────────────

[[entries]]
pattern  = '(^|[^a-z])admin'
category = "reserved-handle"
severity = "block"
applies  = ["username.input"]

[[entries]]
pattern  = '(^|[^a-z])moderator'
category = "reserved-handle"
severity = "block"
applies  = ["username.input"]

[[entries]]
pattern  = '(^|[^a-z])official'
category = "reserved-handle"
severity = "block"
applies  = ["username.input"]

[[entries]]
pattern  = '(^|[^a-z])support'
category = "reserved-handle"
severity = "block"
applies  = ["username.input"]

[[entries]]
pattern  = '(^|[^a-z])system'
except   = ["systematic", "systemic", "ecosystem", "filesystem", "subsystem"]
category = "reserved-handle"
severity = "block"
applies  = ["username.input"]

[[entries]]
pattern  = '(^|[^a-z])staff([^a-z]|$)'
category = "reserved-handle"
severity = "block"
applies  = ["username.input"]
note     = "token-exact so given names like `staffan` stay usable"

[[entries]]
pattern  = '(^|[^a-z])security'
category = "reserved-handle"
severity = "block"
applies  = ["username.input"]

[[entries]]
pattern  = '(^|[^a-z])helpdesk'
category = "reserved-handle"
severity = "block"
applies  = ["username.input"]

[[entries]]
pattern  = '(^|[^a-z])webmaster'
category = "reserved-handle"
severity = "block"
applies  = ["username.input"]

[[entries]]
pattern  = '(^|[^a-z])postmaster'
category = "reserved-handle"
severity = "block"
applies  = ["username.input"]

[[entries]]
pattern  = '(^|[^a-z])root([^a-z]|$)'
category = "reserved-handle"
severity = "block"
applies  = ["username.input"]
note     = "token-exact so `rootbeer_fan` stays usable"

[[entries]]
pattern  = '(^|[^a-z])superuser'
category = "reserved-handle"
severity = "block"
applies  = ["username.input"]

[[entries]]
key      = "sysadmin"
category = "reserved-handle"
severity = "block"
applies  = ["username.input"]

[[entries]]
pattern  = '(^|[^a-z])verif'
category = "reserved-handle"
severity = "block"
