[meta]
list_name      = "username_guard"
version        = "0.1.0-seed"
last_updated   = "2026-07-18"
maintained_by  = "Ripple Company / Iris (seed) → Hank (extend)"
review_cadence = "monthly"

# Username guard list — applies only to `username.input` (one-time
# username setup). Three concerns:
#   1. reserved-handle: platform-role impersonation (admin/support/…)
#   2. brand-impersonation: Arinova brand squatting
#   3. profanity: EN + romanized-zh slurs/vulgarity
#   4. celebrity-impersonation: romanized names for zh_celeb entries
#      that carry no ASCII alias (politicians / religious figures).
#      Alias-bearing zh_celeb entries are covered by the consumer's
#      normalized-alias derivation, NOT duplicated here.
#
# Matching notes: usernames are already format-validated to
# ^[a-z][a-z0-9_]* before this list runs. `pattern` entries use
# (^|[^a-z]) / ([^a-z]|$) as token boundaries — digits and underscores
# both break a token — so `admin_team` and `admin123` match while
# `badminton` does not. Plain `key` entries are substring matches;
# only terms that essentially never occur inside innocent words go in
# as keys.

# ── reserved-handle ─────────────────────────────────────────────────

[[entries]]
pattern  = '(^|[^a-z])admin'
category = "reserved-handle"
severity = "block"
applies  = ["username.input"]

[[entries]]
pattern  = '(^|[^a-z])moderator'
category = "reserved-handle"
severity = "block"
applies  = ["username.input"]

